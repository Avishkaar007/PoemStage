name: Release Desktop Apps

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src-tauri/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest    # Apple Silicon -> .dmg
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest    # Intel Macs -> .dmg
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest  # -> .exe (NSIS installer)
            args: ""
          - platform: ubuntu-22.04    # -> .deb
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Poem Stage v__VERSION__"
          releaseBody: "Automated build from the latest push to main."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
