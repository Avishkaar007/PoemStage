[package]
name = "poem-stage"
version = "1.0.0"
description = "Poem Stage - an interactive poem presentation app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "poem-stage"
path = "src/main.rs"